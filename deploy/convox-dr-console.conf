# Installed on RHEL as /etc/nginx/conf.d/convox-dr-console.conf.
# Keep this separate from the ConVox application's HTTP virtual host.
# Do not create a second default_server or keep .bak files in included directories.
server {
    listen 10.3.0.150:443 ssl;
    server_name 10.3.0.150;

    ssl_certificate /etc/nginx/convox-console/server.crt;
    ssl_certificate_key /etc/nginx/convox-console/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ConVoxConsoleTLS:10m;
    ssl_session_timeout 10m;

    auth_basic "ConVox recovery console";
    auth_basic_user_file /etc/nginx/convox-console/operators.htpasswd;

    access_log /var/log/nginx/convox-console-access.log;
    error_log /var/log/nginx/convox-console-error.log warn;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The local session token protects against cross-site browser requests;
        # Nginx authenticates every static and API request with operator login.
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
